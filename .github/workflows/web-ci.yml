name: web CI

# Gate da Fase 1 (D-08, D-17): ninguém replica valor de DESIGN.md à mão em
# web/, e web/ precisa continuar buildando. Falha aqui bloqueia merge.

on:
  push:
    branches: [main]
    paths:
      - "DESIGN.md"
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "DESIGN.md"
      - "web/**"
      - ".github/workflows/web-ci.yml"

jobs:
  tokens-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: tokens em sincronia com DESIGN.md (D-08)
        run: npm run tokens:check

      - name: typecheck
        run: npx tsc --noEmit

      - run: npm run build
